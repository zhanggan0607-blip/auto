<!DOCTYPE html>
<html>
<head>
    <title>Stream Test</title>
</head>
<body>
    <h1>Streaming Test</h1>
    <div id="output"></div>
    <button onclick="startTest()">Start Stream Test</button>
    <script>
        async function startTest() {
            const output = document.getElementById('output');
            output.innerHTML = 'Starting...<br>';

            try {
                const loginResp = await fetch('http://localhost:8000/api/v1/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'admin123' })
                });
                const loginData = await loginResp.json();
                const token = loginData.data.token.access;

                output.innerHTML += 'Logged in, starting stream...<br>';

                const response = await fetch('http://localhost:8000/api/v1/openclaw/playground/stream_chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        provider_id: 1,
                        model_id: 'gemma3:1b',
                        message: '写一个10字以内的小故事',
                        temperature: 0.7,
                        max_tokens: 200,
                        history: []
                    })
                });

                output.innerHTML += `Status: ${response.status}<br>`;
                output.innerHTML += `Content-Type: ${response.headers.get('Content-Type')}<br>`;

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullContent = '';
                let chunkCount = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.content) {
                                    fullContent += data.content;
                                    chunkCount++;
                                    output.innerHTML += `[Chunk ${chunkCount}] ${data.content}<br>`;
                                }
                            } catch (e) {
                                output.innerHTML += `Parse error: ${e}<br>`;
                            }
                        }
                    }
                }

                output.innerHTML += `<br>=== Complete ===<br>Total chunks: ${chunkCount}<br>`;
                output.innerHTML += `Full content: ${fullContent}`;
            } catch (error) {
                output.innerHTML += `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
