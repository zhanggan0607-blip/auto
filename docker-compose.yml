x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"
    tag: "{{.Name}}"

x-django-env: &django-env
  DJANGO_ENV: production
  DJANGO_SETTINGS_MODULE: config.settings.production
  DB_HOST: postgres
  DB_PORT: 5432
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?请在.env中设置REDIS_PASSWORD}
  MILVUS_HOST: milvus
  MILVUS_PORT: 19530
  MINIO_ENDPOINT: minio:9000

x-celery-django-env: &celery-django-env
  <<: *django-env
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?请在.env中设置REDIS_PASSWORD}@redis:6379/3
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?请在.env中设置REDIS_PASSWORD}@redis:6379/3

services:
  postgres:
    container_name: bid-postgres
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-auto}
      POSTGRES_USER: ${DB_USER:-bid_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在.env中设置DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backup:/backups
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bid_user} -d ${DB_NAME:-auto}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    container_name: bid-redis
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?请在.env中设置REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?请在.env中设置REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 400M
        reservations:
          memory: 128M

  backend:
    container_name: bid-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-v1.0.0}
    image: bid-auto-backend:${APP_VERSION:-v1.0.0}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment: *django-env
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/var/log/bid_auto
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - public-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  fastapi:
    container_name: bid-fastapi
    build:
      context: ./backend
      dockerfile: Dockerfile.fastapi
      args:
        VERSION: ${APP_VERSION:-v1.0.0}
    image: bid-auto-fastapi:${APP_VERSION:-v1.0.0}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment: *django-env
    volumes:
      - backend_media:/app/media
      - backend_logs:/var/log/bid_auto
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  celery-worker:
    container_name: bid-celery-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-v1.0.0}
    image: bid-auto-backend:${APP_VERSION:-v1.0.0}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment: *celery-django-env
    command: ["celery", "-A", "config.celery", "worker", "--loglevel=info", "--concurrency=2", "-Q", "default,notification,workflow,crawler,vector"]
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media
      - backend_logs:/var/log/bid_auto
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  celery-beat:
    container_name: bid-celery-beat
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-v1.0.0}
    image: bid-auto-backend:${APP_VERSION:-v1.0.0}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment: *celery-django-env
    command: ["celery", "-A", "config.celery", "beat", "--loglevel=info"]
    volumes:
      - backend_logs:/var/log/bid_auto
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  frontend:
    container_name: bid-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-v1.0.0}
    image: bid-auto-frontend:${APP_VERSION:-v1.0.0}
    restart: unless-stopped
    logging: *default-logging
    networks:
      - public-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  gateway:
    container_name: bid-gateway
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./docker/nginx/certbot-webroot:/var/www/certbot:ro
      - ./docker/nginx/server.crt:/etc/nginx/ssl/server.crt:ro
      - ./docker/nginx/server.key:/etc/nginx/ssl/server.key:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - backend-net
      - public-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  etcd:
    container_name: bid-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.17
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    profiles:
      - milvus
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - backend-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  minio:
    container_name: bid-minio
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    profiles:
      - milvus
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?请在.env中设置MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?请在.env中设置MINIO_SECRET_KEY}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  milvus:
    container_name: bid-milvus
    image: milvusdb/milvus:v2.4.17
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    profiles:
      - milvus
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    command: ["milvus", "run", "standalone"]
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  postgres_data:
  postgres_backup:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  backend_static:
  backend_media:
  backend_logs:

networks:
  backend-net:
    driver: bridge
  public-net:
    driver: bridge
