[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --cov=apps
    --cov=services
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=50
testpaths = 
    apps
    services
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests
